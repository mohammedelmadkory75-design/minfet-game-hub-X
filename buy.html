<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minfet Game Hub - Checkout</title>

  <style>
    body {
      margin: 0;
      background: #070a12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .wrap {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    .box {
      background: #101a2a;
      border: 1px solid #293b5b;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .muted {
      color: #9aa8bd;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }

    .paypal {
      display: block;
      background: #ffc439;
      color: #111;
      padding: 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #9aa8bd;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="box">

      <h1>Minfet Game Hub Checkout</h1>

      <p class="muted">You're buying:</p>

      <h2 id="game">Game</h2>

      <div id="itemsList" class="muted"></div>

      <div class="price">
        $<span id="price">0.00</span>
      </div>

      <p class="muted">
        Continue to PayPal to complete your purchase.
      </p>

      <a
        class="paypal"
        href="#"
        id="paypal">
        Pay with PayPal
      </a>

      <a class="back" href="index.html">
        ← Back to Minfet Game Hub
      </a>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const items = params.get("items");
    const game = params.get("game") || "Game";
    const total = params.get("total") || params.get("price") || "0.00";

    document.getElementById("game").textContent =
      items ? "Your selected games" : game;

    document.getElementById("itemsList").textContent =
      items ? items.split("|").join(", ") : "";

    document.getElementById("price").textContent = total;
  </script>

</body>
</html>
